name: Atualizar resultados

on:
  workflow_dispatch:
    inputs:
      competition_id:
        description: "ID da competicao (all, brasileirao-test ou worldcup-2026)"
        required: true
        default: "brasileirao-test"
        type: choice
        options:
          - brasileirao-test
          - worldcup-2026
          - all

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sync:
    name: Importar jogos e recalcular ranking
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:scoring
      - name: Sincronizar Firestore
        run: node scripts/sync-results.mjs "${{ inputs.competition_id }}"
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
