<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#031b2c" />
    <meta name="description" content="Campeões do Bolão da Copa do Mundo 2026." />
    <title>Campeões do Bolão da Copa 2026</title>
    <style>
      * { box-sizing: border-box; }
      html, body { min-width: 320px; min-height: 100%; margin: 0; }
      body {
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: clamp(12px, 3vw, 32px);
        background: #031b2c;
      }
      img {
        display: block;
        width: min(100%, 1280px);
        height: auto;
        max-height: calc(100dvh - clamp(24px, 6vw, 64px));
        object-fit: contain;
      }
    </style>
  </head>
  <body>
    <img
      src="/Bolao/banner-campeoes.jpg"
      alt="Campeões do Bolão da Copa do Mundo 2026: Raphael Piazzarollo em primeiro lugar, Maurieli Deepseek em segundo, e Yasmeen e Paulo Giusti empatados em terceiro."
    />
  </body>
</html>
